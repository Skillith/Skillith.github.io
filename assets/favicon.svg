<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with dark tech theme -->
  <rect width="32" height="32" rx="8" fill="#080b11" />
  <!-- Glowing border -->
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="url(#grad)" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Stylized Monogram S representing Sam Ebrahimi -->
  <path d="M11 10h10a3 3 0 0 1 3 3a3 3 0 0 1-3 3H11a3 3 0 0 0-3 3a3 3 0 0 0 3 3h10" 
        fill="none" 
        stroke="url(#grad)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
